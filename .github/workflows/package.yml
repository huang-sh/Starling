name: Package Starling

on:
  push:
    branches: [main, dev, rust]
  pull_request:
    branches: [main, dev, rust]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  package-native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: starling-linux-x64
            libc: glibc
          - name: linux-x64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: starling-linux-x64-musl
            libc: musl
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: starling-linux-arm64
            libc: glibc
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: starling-darwin-x64
            libc: ""
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: starling-darwin-arm64
            libc: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        if: matrix.libc != 'glibc'
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build tools
        if: matrix.libc == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install npm dependencies
        run: npm ci

      - name: Build GNU binary (GLIBC 2.31 baseline)
        if: matrix.libc == 'glibc'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          docker run --rm \
            --env TARGET \
            --env CARGO_NET_GIT_FETCH_WITH_CLI \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/rust \
            rust:1.91.1-bullseye@sha256:f02c249a0dd84eda8a3403b6fb1a4a59fee86157f1657cb1f8baaf3d89fe2d88 \
            bash -c '
              set -euo pipefail
              rustup target add "$TARGET"
              if [[ "$TARGET" == "aarch64-unknown-linux-gnu" ]]; then
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends \
                  gcc-aarch64-linux-gnu libc6-dev-arm64-cross
                export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              fi
              cargo build --release --locked --target "$TARGET"
            '

      - name: Stage GNU binary
        if: matrix.libc == 'glibc'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          npm run build:ts
          mkdir -p "npm/vendor/${TARGET}/bin"
          cp "rust/target/${TARGET}/release/starling" "npm/vendor/${TARGET}/bin/starling"
          chmod +x "npm/vendor/${TARGET}/bin/starling"

      - name: Verify GNU GLIBC baseline
        if: matrix.libc == 'glibc'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="rust/target/${TARGET}/release/starling"
          max_glibc="$({
            readelf --version-info "$binary" \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' \
              | sed 's/^GLIBC_//' \
              | sort -Vu \
              | tail -n 1
          })"
          [[ -n "$max_glibc" ]] || { echo "No GLIBC symbol versions found in ${binary}"; exit 1; }
          newest="$(printf '%s\n%s\n' "$max_glibc" "2.31" | sort -V | tail -n 1)"
          [[ "$newest" == "2.31" ]] \
            || { echo "${binary} requires GLIBC ${max_glibc}; maximum supported is 2.31"; exit 1; }
          echo "Verified ${binary}: maximum GLIBC symbol version ${max_glibc}"

      - name: Build and stage native binary
        if: matrix.libc != 'glibc'
        run: npm run build -- --target=${{ matrix.target }}

      - name: Verify GNU x64 on GLIBC 2.31
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214 \
            /workspace/npm/vendor/${{ matrix.target }}/bin/starling --version

      - name: Test staged binary
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              echo "Skipping execution test for cross-compiled Linux arm64 binary"
              ;;
            x86_64-unknown-linux-musl)
              ./npm/vendor/${{ matrix.target }}/bin/starling --version
              ;;
            *)
              npm run run -- --version
              ;;
          esac

      - name: Pack native npm package
        run: scripts/stage_npm_packages.sh ${{ matrix.target }}

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/*.tgz
          if-no-files-found: error

  package-js:
    name: starling-ai npm package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build TypeScript renderer
        run: npm run build:ts

      - name: Stage npm package assets
        run: |
          mkdir -p npm/scripts
          cp scripts/install-agent-skills.js npm/scripts/
          rm -rf npm/skills
          cp -R skills npm/skills

      - name: Pack main npm package
        run: |
          mkdir -p dist
          npm pack ./npm --pack-destination dist

      - name: Upload main npm package
        uses: actions/upload-artifact@v4
        with:
          name: starling-ai
          path: dist/starling-ai-*.tgz
          if-no-files-found: error
